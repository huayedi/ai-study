server:
  port: 8080

spring:
  application:
    name: erp-ai-assistant
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 学习测试库（非公司生产）。可用环境变量覆盖。
    url: jdbc:mysql://${MYSQL_HOST:154.8.183.10}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: erp-ai-hikari
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.erp.ai.common.entity,com.erp.ai.chat.entity,com.erp.ai.tool.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true

# =========================
# AI 配置说明（学习重点）
# =========================
# 学习库 MySQL + HikariCP + MyBatis-Plus（SQL 在 mapper/**/*.xml）
# 包分层：chat / tool / rag / common 各自隔离（controller 在域内）
#
# DeepSeek 推荐环境变量：
#   AI_PROVIDER=openai-compatible
#   AI_BASE_URL=https://api.deepseek.com
#   AI_API_KEY=sk-你的真实Key
#   AI_MODEL=deepseek-v4-pro
#
# 注意：
# 1) 不要把真实 LLM Key 写进本文件并提交 Git
# 2) 本 MySQL 仅为学习测试库，严禁当公司生产库使用
# 3) 修改本文件后需重启应用
ai:
  provider: ${AI_PROVIDER:openai-compatible}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  api-key: ${AI_API_KEY}
  model: ${AI_MODEL:deepseek-v4-pro}
  temperature: 0.2
  timeout-ms: 30000
  max-retries: 2
  price-input-per-1k: 0.00015
  price-output-per-1k: 0.0006
  session:
    max-messages: 20
  rag:
    top-k: 3
    classpath-docs: rag-docs
    retriever: ${AI_RAG_RETRIEVER:keyword}
    recall-k: ${AI_RAG_RECALL_K:10}
    rrf-k: ${AI_RAG_RRF_K:60}
    min-score: ${AI_RAG_MIN_SCORE:0.02}
    skip-llm-on-empty: true
    embedding-provider: ${AI_EMBEDDING_PROVIDER:hash}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-base-url: ${AI_EMBEDDING_BASE_URL:}
    embedding-dimensions: 256
  tool:
    timeout-ms: ${AI_TOOL_TIMEOUT_MS:3000}
    chat-path: ${AI_TOOL_CHAT_PATH:tool-calls}
    max-rounds: ${AI_TOOL_MAX_ROUNDS:4}

logging:
  level:
    com.erp.ai: INFO
    com.erp.ai.chat.mapper: DEBUG
    com.erp.ai.tool.mapper: DEBUG
    com.erp.ai.common.mapper: DEBUG
